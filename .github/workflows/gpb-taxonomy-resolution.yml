name: GPB Taxonomy Resolution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/resolve-col-taxonomy.mjs"
      - "scripts/data/current-catalog-taxa.json"
      - ".github/workflows/gpb-taxonomy-resolution.yml"

permissions:
  contents: read

jobs:
  resolve-col:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve 149 canonical taxa against pinned COL XR
        run: node scripts/resolve-col-taxonomy.mjs

      - name: Upload taxonomy resolution artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpb-col-taxonomy-resolution
          path: artifacts/taxonomy-resolution/
          if-no-files-found: error
          retention-days: 14
