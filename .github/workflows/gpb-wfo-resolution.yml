name: GPB WFO Backbone Resolution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gpb-wfo-resolution.yml"
      - "scripts/resolve-wfo-taxonomy.mjs"
      - "scripts/data/current-catalog-taxa.json"

permissions:
  contents: read

jobs:
  resolve-wfo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download pinned WFO 2026-06 backbone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/wfo
          curl --fail --location --retry 5 --retry-delay 2             "https://zenodo.org/records/20782718/files/_DwC_backbone_R.zip?download=1"             -o .cache/wfo/backbone.zip
          curl --fail --location --retry 5 --retry-delay 2             "https://zenodo.org/records/20782718/files/ipni_to_wfo.csv.gz?download=1"             -o .cache/wfo/ipni_to_wfo.csv.gz

          echo "0e4486945cd9f7af548ca87eb9a870ed  .cache/wfo/backbone.zip" | md5sum -c -
          echo "faa5aae66e51dce6b9890a4f78817bb6  .cache/wfo/ipni_to_wfo.csv.gz" | md5sum -c -

          unzip -q .cache/wfo/backbone.zip -d .cache/wfo/backbone

      - name: Inspect pinned archive structure
        shell: bash
        run: |
          set -euo pipefail
          find .cache/wfo/backbone -maxdepth 2 -type f -printf '%P\n' | sort | head -80
          echo "--- classification.csv header/sample ---"
          head -5 .cache/wfo/backbone/classification.csv
          echo "--- IPNI/WFO mapping sample ---"
          gzip -dc .cache/wfo/ipni_to_wfo.csv.gz | head -8 || true

      - name: Resolve current YAKU taxa
        run: node scripts/resolve-wfo-taxonomy.mjs

      - name: Upload WFO resolution artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpb-wfo-taxonomy-resolution
          path: artifacts/taxonomy-resolution/
          if-no-files-found: error
          retention-days: 14
