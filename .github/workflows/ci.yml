name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependency audit (tracked in #38)
        # Expo SDK 52 currently pulls known high/critical advisories through its
        # CLI/Metro/config toolchain. Keep the result visible without masking
        # regressions in this bugfix PR; #38 owns the breaking SDK/RN upgrade.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Forbidden safety copy must be absent
        run: |
          # These strings assert edibility/foraging and must never reappear.
          if grep -rn -e '食用可' -e '食用可能' -e '食用植物' -e '安全な収穫' -e 'AI認識精度' src app; then
            echo "::error::Forbidden safety/copy string found"; exit 1
          fi
      - name: Web export
        run: npm run build:web
